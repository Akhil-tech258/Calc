<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casio fx-991 PRO — Scientific & Base-N Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="calc-wrapper">
    <div class="calculator">
        <!-- Top Toolbar -->
        <div class="calc-header">
            <div class="brand-block">
                <span class="calc-brand">CASIO</span>
                <span class="calc-model">fx-991 PRO</span>
            </div>
            <div class="header-badges">
                <span class="status-chip" id="mathChip">MATH</span>
                <span class="status-chip chip-base" id="activeBaseChip">DEC</span>
                <button type="button" id="degRadBtn" class="mode-pill" title="Toggle Degrees / Radians">DEG</button>
                <button type="button" id="historyToggleBtn" class="icon-pill" title="Calculation History">📜</button>
            </div>
        </div>

        <!-- Dual-line Display -->
        <div class="display-container">
            <div class="history-expr" id="prevExpression"></div>
            <input type="text" id="display" value="0" readonly autocomplete="off">
        </div>

        <!-- Base-N Conversion Strip (HEX, DEC, OCT, BIN) -->
        <div class="base-n-strip" id="baseNStrip">
            <button class="base-item active" data-base="dec" id="baseBtnDec">
                <span class="base-tag">DEC</span>
                <span class="base-val" id="baseValDec">0</span>
            </button>
            <button class="base-item" data-base="hex" id="baseBtnHex">
                <span class="base-tag">HEX</span>
                <span class="base-val" id="baseValHex">0</span>
            </button>
            <button class="base-item" data-base="oct" id="baseBtnOct">
                <span class="base-tag">OCT</span>
                <span class="base-val" id="baseValOct">0</span>
            </button>
            <button class="base-item" data-base="bin" id="baseBtnBin">
                <span class="base-tag">BIN</span>
                <span class="base-val" id="baseValBin">0</span>
            </button>
        </div>

        <!-- Section 1: Scientific & Programmer Functions (6 columns) -->
        <div class="func-grid">
            <!-- Row 1: Mode, Parentheses, Const, Clear -->
            <button class="btn btn-fn" onclick="toggleBaseMode()" title="Cycle Base-N (DEC -> HEX -> BIN -> OCT)">BASE-N</button>
            <button class="btn btn-fn" onclick="append('(')">(</button>
            <button class="btn btn-fn" onclick="append(')')">)</button>
            <button class="btn btn-fn" onclick="appendMathConst('PI')">π</button>
            <button class="btn btn-danger" onclick="clearDisplay()">AC</button>
            <button class="btn btn-warn" onclick="backspace()">⌫</button>

            <!-- Row 2: Trig & Powers -->
            <button class="btn btn-fn" onclick="sin()">sin</button>
            <button class="btn btn-fn" onclick="cos()">cos</button>
            <button class="btn btn-fn" onclick="tan()">tan</button>
            <button class="btn btn-fn" onclick="power(2)">x²</button>
            <button class="btn btn-fn" onclick="customPower()" title="x to the power of y">xʸ</button>
            <button class="btn btn-fn" onclick="sqrt()">√</button>

            <!-- Row 3: Math Extras & Logs -->
            <button class="btn btn-fn" onclick="log10()">log</button>
            <button class="btn btn-fn" onclick="ln()">ln</button>
            <button class="btn btn-fn" onclick="factorial()" title="Factorial (n!)">x!</button>
            <button class="btn btn-fn" onclick="reciprocal()" title="Reciprocal (1/x)">1/x</button>
            <button class="btn btn-fn" onclick="absVal()" title="Absolute Value (|x|)">|x|</button>
            <button class="btn btn-fn" onclick="append('%')" title="Modulo / Remainder">mod</button>

            <!-- Row 4: Hex Keys (A, B, C, D, E, F) -->
            <button class="btn btn-hex disabled" data-hex="A" onclick="appendHex('A')">A</button>
            <button class="btn btn-hex disabled" data-hex="B" onclick="appendHex('B')">B</button>
            <button class="btn btn-hex disabled" data-hex="C" onclick="appendHex('C')">C</button>
            <button class="btn btn-hex disabled" data-hex="D" onclick="appendHex('D')">D</button>
            <button class="btn btn-hex disabled" data-hex="E" onclick="appendHex('E')">E</button>
            <button class="btn btn-hex disabled" data-hex="F" onclick="appendHex('F')">F</button>
        </div>

        <div class="keypad-divider"></div>

        <!-- Section 2: Standard 4-Column Number Pad -->
        <div class="numpad-grid">
            <button class="btn btn-num" data-num="7" onclick="append('7')">7</button>
            <button class="btn btn-num" data-num="8" onclick="append('8')">8</button>
            <button class="btn btn-num" data-num="9" onclick="append('9')">9</button>
            <button class="btn btn-op" onclick="append('/')">÷</button>

            <button class="btn btn-num" data-num="4" onclick="append('4')">4</button>
            <button class="btn btn-num" data-num="5" onclick="append('5')">5</button>
            <button class="btn btn-num" data-num="6" onclick="append('6')">6</button>
            <button class="btn btn-op" onclick="append('*')">×</button>

            <button class="btn btn-num" data-num="1" onclick="append('1')">1</button>
            <button class="btn btn-num" data-num="2" onclick="append('2')">2</button>
            <button class="btn btn-num" data-num="3" onclick="append('3')">3</button>
            <button class="btn btn-op" onclick="append('-')">−</button>

            <button class="btn btn-num btn-zero" data-num="0" onclick="append('0')">0</button>
            <button class="btn btn-num" id="btnDot" onclick="append('.')">.</button>
            <button class="btn btn-equal" onclick="calculate()">=</button>
            <button class="btn btn-op" onclick="append('+')">+</button>
        </div>
    </div>

    <!-- History Slide-over Drawer -->
    <div class="history-drawer" id="historyDrawer">
        <div class="drawer-header">
            <h3>📜 Calculation History</h3>
            <button class="drawer-close-btn" id="drawerCloseBtn">✕</button>
        </div>
        <div class="history-list" id="historyList">
            <p class="history-empty">No calculations recorded yet.</p>
        </div>
        <div class="drawer-footer">
            <button class="btn-clear-history" id="clearHistoryBtn">Clear Tape</button>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
